services:
  postgres:
    image: postgres:16-alpine
    container_name: thue_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-thue_erp}
      POSTGRES_USER: ${DB_USER:-thue_erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-thue_erp} -d ${DB_NAME:-thue_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - thue_erp_postgres:/var/lib/postgresql/data
    networks:
      - thue_erp_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thue_erp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-thue-erp-super-secret-key-2026}
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DB_ENGINE: "postgres"
      DB_NAME: ${DB_NAME:-thue_erp}
      DB_USER: ${DB_USER:-thue_erp}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      COMMON_REQUIRE_VERIFICATION: "True"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.locmem.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@example.local}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
    volumes:
      - ./backend:/app
      - /app/venv
    ports:
      - "8080:8080"
    command: >
      sh -c "python manage.py migrate && python manage.py sync_company_setup && python manage.py seed_exercise_data && python manage.py runserver 0.0.0.0:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/docs/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10m
    networks:
      - thue_erp_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thue_erp_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - thue_erp_net

volumes:
  thue_erp_postgres:

networks:
  thue_erp_net:
    driver: bridge
