# Production override (Audit 2026-10-27, P0).
# Dùng:  docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Bắt buộc đặt trong .env (KHÔNG commit giá trị thật):
#   SECRET_KEY, DB_PASSWORD, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS
#   SUPERADMIN_PASSWORD, ADMIN_PASSWORD
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD bắt buộc trong production}

  backend:
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY bắt buộc trong production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS bắt buộc - vd erp.example.com}
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS bắt buộc - vd https://erp.example.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS bắt buộc - vd https://erp.example.com}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD bắt buộc trong production}
      SEED_DEMO_DATA: "False"
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD bắt buộc trong production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD bắt buộc trong production}
    # Không mount mã nguồn trong production: chạy đúng code đã build vào image.
    volumes: !reset []

  worker:
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY bắt buộc trong production}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD bắt buộc trong production}
    volumes: !reset []

  frontend:
    volumes: !reset []
